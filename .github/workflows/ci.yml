name: CI

# Nur für Pull Requests: main ändert sich ausschließlich über geprüfte PRs, ein zweiter Lauf nach dem Merge
# brächte nichts Neues. Releases baut release.yml beim Versions-Tag.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Baut auch den net48-Runner (über die Referenz-Assemblies) und den Windows-Teil des Servers.
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  # HTTPS unter Windows: TLS über Schannel und ein Zertifikat im Speicher des Computers mit nicht exportierbarem Schlüssel,
  # wie es Autoenrollment einer AD-Zertifizierungsstelle ablegt. Die übrigen Tests laufen oben unter Linux.
  windows-https:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Server certificate in the machine store
        shell: pwsh
        run: |
          $name = "inventory-ci.example.test"
          $cert = New-SelfSignedCertificate -DnsName $name -CertStoreLocation Cert:\LocalMachine\My -KeyExportPolicy NonExportable `
            -KeyUsage DigitalSignature,KeyEncipherment -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.1") -NotAfter (Get-Date).AddDays(90)
          # Als Stammzertifikat vertraut, damit die Kette aufgeht wie bei einer Zertifizierungsstelle der Domäne.
          $root = [System.Security.Cryptography.X509Certificates.X509Store]::new("Root", "LocalMachine")
          $root.Open("ReadWrite")
          $root.Add([System.Security.Cryptography.X509Certificates.X509Certificate2]::new($cert.RawData))
          $root.Close()
          "INVENTORY_STORE_CERTIFICATE=$name" >> $env:GITHUB_ENV
          "INVENTORY_STORE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
      - run: dotnet test tests/Inventory.Tests -c Release --filter "FullyQualifiedName~HttpsTests"

  # Der Runner auf einem echten Windows: das Inventar muss die Windows-Features und WSL enthalten. Eine Distribution legt der
  # Job selbst an (Registrierung im Profil des Benutzers, virtuelle Festplatte mit festem Datum), wie WSL es täte.
  windows-runner:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Inventory.Runner -c Release -f net48
      - name: WSL distribution of the current user
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP "wsl-ci"
          New-Item -ItemType Directory $base | Out-Null
          $disk = Join-Path $base "ext4.vhdx"
          Set-Content $disk ("x" * 1024) -NoNewline
          (Get-Item $disk).LastWriteTimeUtc = [datetime]::new(2026, 1, 2, 3, 4, 5, [DateTimeKind]::Utc)
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Lxss\{6f1d2b9e-5a51-4c1e-9d7e-1b2c3d4e5f60}"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty $key -Name DistributionName -Value "Inventory-CI" | Out-Null
          New-ItemProperty $key -Name Version -PropertyType DWord -Value 2 | Out-Null
          New-ItemProperty $key -Name State -PropertyType DWord -Value 1 | Out-Null
          New-ItemProperty $key -Name BasePath -Value "\\?\$base" | Out-Null
      - name: Collect the inventory
        shell: pwsh
        run: |
          & src\Inventory.Runner\bin\Release\net48\InventoryRunner.exe --collect > inventory.json
          if ($LASTEXITCODE -ne 0) { throw "--collect: $LASTEXITCODE" }
          $inventory = Get-Content inventory.json -Raw | ConvertFrom-Json
          $inventory.optionalFeatures | Format-Table name, caption -AutoSize | Out-String -Width 200
          $inventory.wsl | ConvertTo-Json -Depth 4
          $inventory.warnings
          if (-not $inventory.optionalFeatures -or $inventory.optionalFeatures.Count -eq 0) { throw "no optional features" }
          if ($inventory.warnings | Where-Object { $_ -like "Windows-Features:*" -or $_ -like "WSL:*" }) { throw "warnings for features or WSL" }
          if (-not $inventory.wsl.installed) { throw "WSL not reported as installed" }
          $distro = @($inventory.wsl.distros | Where-Object name -eq "Inventory-CI")
          if ($distro.Count -ne 1) { throw "distribution missing" }
          if ($distro[0].wslVersion -ne 2 -or -not $distro[0].userSid -or $distro[0].sizeBytes -ne 1024) { throw "distribution incomplete" }
          if (([datetime]$distro[0].lastUsedUtc).ToUniversalTime() -ne [datetime]::new(2026, 1, 2, 3, 4, 5, [DateTimeKind]::Utc)) { throw "last use: $($distro[0].lastUsedUtc)" }

  # Let's Encrypt eingebaut: der ACME-Ablauf gegen Pebble, den Testserver von Let's Encrypt, mit dessen DNS-Testserver statt
  # Azure DNS (den Zugriff auf Azure prüfen die Tests oben mit nachgebildeten Antworten).
  acme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pebble with its DNS test server
        run: |
          docker network create acme
          docker run -d --name challtestsrv --network acme -p 8055:8055 ghcr.io/letsencrypt/pebble-challtestsrv:2.10.3 -defaultIPv6 "" -defaultIPv4 127.0.0.1
          docker run -d --name pebble --network acme -p 14000:14000 -e PEBBLE_VA_NOSLEEP=1 -e PEBBLE_WFE_NONCEREJECT=0 \
            ghcr.io/letsencrypt/pebble:2.10.3 -dnsserver challtestsrv:8053
          for i in $(seq 30); do curl -skf https://localhost:14000/dir >/dev/null && break; sleep 1; done
          curl -skf https://localhost:14000/dir
      - run: dotnet test tests/Inventory.Tests -c Release --filter "FullyQualifiedName~AcmeTests"
        env:
          INVENTORY_ACME_DIRECTORY: https://localhost:14000/dir
          INVENTORY_CHALLTESTSRV: http://localhost:8055

  # Der Mac-Agent auf einem echten Mac (GitHub-Runner, Apple Silicon): als root wie im Betrieb, und das Inventar muss die
  # wichtigsten Bereiche enthalten. Die Parser selbst prüfen die Tests oben mit aufgezeichneten Ausgaben.
  macos-agent:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/Inventory.Agent.MacOS -c Release -r osx-arm64 -o agent
      - run: sudo ./agent/inventory-agent --collect > inventory.json
      - run: |
          jq '{platform, computerName, osName, osVersion, model, serialNumber, cpuName, cpuCores, memoryBytes, primaryIpAddress, software: (.software | length), softwareKinds: ([.software[] | "\(.architecture)/\(.origin)"] | group_by(.) | map({(.[0]): length}) | add), packages: [.apps[]? | "\(.kind) \(.name)"], disks, networkAdapters: [.networkAdapters[].name], users: .localUsers, macOs, volumes: .hardware.volumes, warnings}' inventory.json
      - run: >
          jq -e '.platform == "macOS" and (.computerName | length > 0) and (.osName | startswith("macOS")) and .cpuCores > 0 and .memoryBytes > 0
          and (.software | length > 0) and (.disks | length > 0) and (.networkAdapters | length > 0) and (.hardware.volumes[0].protected != null)
          and (.macOs.gatekeeperEnabled != null) and (.primaryIpAddress != null) and (.apps != null)
          and ([.software[] | select(.architecture != null and .origin != null)] | length > 0)' inventory.json
      # Das Installationspaket (Intune, Jamf), wie es der Server baut, mit dem eben veröffentlichten Agenten: installieren wie
      # ein MDM, ohne erreichbaren Server. Der Agent muss als LaunchDaemon laufen und es weiter versuchen.
      # Das Paket verlangt beide Agenten; auf diesem Runner (Apple Silicon) zählt nur der für arm64, der Platz für Intel bekommt eine Kopie.
      - run: mkdir -p agent-macos/osx-arm64 agent-macos/osx-x64 && cp agent/inventory-agent agent-macos/osx-arm64/ && cp agent/inventory-agent agent-macos/osx-x64/
      - run: dotnet test tests/Inventory.Tests --filter "FullyQualifiedName~MacPackageTests"
        env:
          INVENTORY_MAC_AGENT_DIR: ${{ github.workspace }}/agent-macos
          INVENTORY_MAC_PKG: ${{ github.workspace }}/inventory-agent.pkg
      - run: |
          pkgutil --expand inventory-agent.pkg expanded
          cat expanded/PackageInfo
          # Die leere Payload ist der Ordner "/": Rechte und Eigentümer dürfen sich dadurch nicht ändern.
          root_before="$(stat -f '%Sp %Su:%Sg' /)"
          sudo installer -pkg inventory-agent.pkg -target /
          [ "$(stat -f '%Sp %Su:%Sg' /)" = "$root_before" ]
          pkgutil --pkg-info inventory.agent
          sleep 10
          dir="/Library/Application Support/Inventory Agent"
          sudo ls -la "$dir"
          sudo cat "$dir/agent.log"
          sudo launchctl print system/inventory.agent | head -30
          sudo launchctl print system/inventory.agent | grep -q 'state = running'
          sudo grep -q 'Fehler' "$dir/agent.log"
          sudo codesign --verify "$dir/inventory-agent"
      # Zum Vergleich, falls das Paket nicht durchgeht: dasselbe (leere Payload, Skripte), wie Apples pkgbuild es baut.
      - if: failure()
        run: |
          mkdir -p ref/root ref/scripts && printf '#!/bin/bash\nexit 0\n' > ref/scripts/postinstall && chmod +x ref/scripts/postinstall
          pkgbuild --root ref/root --scripts ref/scripts --identifier ref.test --version 1 --install-location / ref.pkg
          xar --dump-toc=ref-toc.xml -f ref.pkg && cat ref-toc.xml
          pkgutil --expand ref.pkg ref/expanded && ls -la ref/expanded && cat ref/expanded/PackageInfo
          tail -60 /var/log/install.log
