name: CI

# Nur für Pull Requests: main ändert sich ausschließlich über geprüfte PRs, ein zweiter Lauf nach dem Merge
# brächte nichts Neues. Releases baut release.yml beim Versions-Tag.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Baut auch den net48-Runner (über die Referenz-Assemblies) und den Windows-Teil des Servers.
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  # HTTPS unter Windows: TLS über Schannel und ein Zertifikat im Speicher des Computers mit nicht exportierbarem Schlüssel,
  # wie es Autoenrollment einer AD-Zertifizierungsstelle ablegt. Die übrigen Tests laufen oben unter Linux.
  windows-https:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Server certificate in the machine store
        shell: pwsh
        run: |
          $name = "inventory-ci.example.test"
          $cert = New-SelfSignedCertificate -DnsName $name -CertStoreLocation Cert:\LocalMachine\My -KeyExportPolicy NonExportable `
            -KeyUsage DigitalSignature,KeyEncipherment -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.1") -NotAfter (Get-Date).AddDays(90)
          # Als Stammzertifikat vertraut, damit die Kette aufgeht wie bei einer Zertifizierungsstelle der Domäne.
          $root = [System.Security.Cryptography.X509Certificates.X509Store]::new("Root", "LocalMachine")
          $root.Open("ReadWrite")
          $root.Add([System.Security.Cryptography.X509Certificates.X509Certificate2]::new($cert.RawData))
          $root.Close()
          "INVENTORY_STORE_CERTIFICATE=$name" >> $env:GITHUB_ENV
          "INVENTORY_STORE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
      - run: dotnet test tests/Inventory.Tests -c Release --filter "FullyQualifiedName~HttpsTests"

  # Der Mac-Agent auf einem echten Mac (GitHub-Runner, Apple Silicon): als root wie im Betrieb, und das Inventar muss die
  # wichtigsten Bereiche enthalten. Die Parser selbst prüfen die Tests oben mit aufgezeichneten Ausgaben.
  macos-agent:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/Inventory.Agent.MacOS -c Release -r osx-arm64 -o agent
      - run: sudo ./agent/inventory-agent --collect > inventory.json
      - run: |
          jq '{platform, computerName, osName, osVersion, model, serialNumber, cpuName, cpuCores, memoryBytes, primaryIpAddress, software: (.software | length), softwareKinds: ([.software[] | "\(.architecture)/\(.origin)"] | group_by(.) | map({(.[0]): length}) | add), packages: [.apps[]? | "\(.kind) \(.name)"], disks, networkAdapters: [.networkAdapters[].name], users: .localUsers, macOs, volumes: .hardware.volumes, warnings}' inventory.json
      - run: >
          jq -e '.platform == "macOS" and (.computerName | length > 0) and (.osName | startswith("macOS")) and .cpuCores > 0 and .memoryBytes > 0
          and (.software | length > 0) and (.disks | length > 0) and (.networkAdapters | length > 0) and (.hardware.volumes[0].protected != null)
          and (.macOs.gatekeeperEnabled != null) and (.primaryIpAddress != null) and (.apps != null)
          and ([.software[] | select(.architecture != null and .origin != null)] | length > 0)' inventory.json
