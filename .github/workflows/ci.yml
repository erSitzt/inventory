name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Baut auch den net48-Runner (über die Referenz-Assemblies) und den Windows-Teil des Servers.
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
