name: CI

# Nur für Pull Requests: main ändert sich ausschließlich über geprüfte PRs, ein zweiter Lauf nach dem Merge
# brächte nichts Neues. Releases baut release.yml beim Versions-Tag.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Baut auch den net48-Runner (über die Referenz-Assemblies) und den Windows-Teil des Servers.
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  # HTTPS unter Windows: TLS über Schannel und ein Zertifikat im Speicher des Computers mit nicht exportierbarem Schlüssel,
  # wie es Autoenrollment einer AD-Zertifizierungsstelle ablegt. Die übrigen Tests laufen oben unter Linux.
  windows-https:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Server certificate in the machine store
        shell: pwsh
        run: |
          $name = "inventory-ci.example.test"
          $cert = New-SelfSignedCertificate -DnsName $name -CertStoreLocation Cert:\LocalMachine\My -KeyExportPolicy NonExportable `
            -KeyUsage DigitalSignature,KeyEncipherment -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.1") -NotAfter (Get-Date).AddDays(90)
          # Als Stammzertifikat vertraut, damit die Kette aufgeht wie bei einer Zertifizierungsstelle der Domäne.
          $root = [System.Security.Cryptography.X509Certificates.X509Store]::new("Root", "LocalMachine")
          $root.Open("ReadWrite")
          $root.Add([System.Security.Cryptography.X509Certificates.X509Certificate2]::new($cert.RawData))
          $root.Close()
          "INVENTORY_STORE_CERTIFICATE=$name" >> $env:GITHUB_ENV
          "INVENTORY_STORE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
      - run: dotnet test tests/Inventory.Tests -c Release --filter "FullyQualifiedName~HttpsTests"

  # Der Runner auf einem echten Windows: das Inventar muss die Windows-Features und WSL enthalten. Die Distributionen legt der
  # Job selbst an (Registrierung im Profil des Benutzers, virtuelle Festplatte mit festem Datum), wie WSL es täte. Zwei davon
  # liegen hinter einem Netzwerkpfad, direkt und über einen symbolischen Link: Der Runner darf sie nicht anfassen, sonst
  # meldete er sich als Lokales System mit dem Computerkonto bei einem Server an, den ein Benutzer bestimmt.
  windows-runner:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Inventory.Runner -c Release -f net48
      - name: WSL distributions of the current user
        shell: pwsh
        run: |
          function Disk($folder) {
            New-Item -ItemType Directory $folder -Force | Out-Null
            $disk = Join-Path $folder "ext4.vhdx"
            Set-Content $disk ("x" * 1024) -NoNewline
            (Get-Item $disk).LastWriteTimeUtc = [datetime]::new(2026, 1, 2, 3, 4, 5, [DateTimeKind]::Utc)
          }
          function Distro($id, $name, $basePath) {
            $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Lxss\{$id}"
            New-Item -Path $key -Force | Out-Null
            New-ItemProperty $key -Name DistributionName -Value $name | Out-Null
            New-ItemProperty $key -Name Version -PropertyType DWord -Value 2 | Out-Null
            New-ItemProperty $key -Name State -PropertyType DWord -Value 1 | Out-Null
            New-ItemProperty $key -Name BasePath -Value $basePath | Out-Null
          }
          Disk "C:\wsl-ci"
          Disk "C:\wsl-ci-remote"
          New-Item -ItemType SymbolicLink -Path "C:\wsl-ci\link" -Target "\\localhost\C$\wsl-ci-remote" | Out-Null
          # Ohne die Prüfung im Runner wären beide lesbar.
          if (-not (Test-Path "\\localhost\C$\wsl-ci-remote\ext4.vhdx") -or -not (Test-Path "C:\wsl-ci\link\ext4.vhdx")) { throw "network disk not reachable" }
          Distro "6f1d2b9e-5a51-4c1e-9d7e-1b2c3d4e5f60" "Inventory-CI" "\\?\C:\wsl-ci"
          Distro "6f1d2b9e-5a51-4c1e-9d7e-1b2c3d4e5f61" "Inventory-CI-UNC" "\\?\UNC\localhost\C$\wsl-ci-remote"
          Distro "6f1d2b9e-5a51-4c1e-9d7e-1b2c3d4e5f62" "Inventory-CI-Link" "C:\wsl-ci\link"
      # Windows-Update-Richtlinie über die lokale Gruppenrichtlinie (Registry.pol im PReg-Format, wie gpedit sie schreibt), damit
      # RSoP eine GPO dazu kennt; dazu ein Wert ohne GPO, wie ihn ein Skript setzen würde. Einen Wert löscht die GPO erst und
      # setzt ihn dann, wie auf Servern gesehen: Das darf nicht als Konflikt der GPO mit sich selbst erscheinen.
      - name: Windows Update policy from the local Group Policy
        shell: pwsh
        run: |
          $unicode = [Text.Encoding]::Unicode
          $pol = [Collections.Generic.List[byte]]::new()
          $pol.AddRange([byte[]](0x50, 0x52, 0x65, 0x67, 1, 0, 0, 0))
          function Entry([string]$name, [uint32]$type, [byte[]]$data) {
            $pol.AddRange($unicode.GetBytes("[Software\Policies\Microsoft\Windows\WindowsUpdate\AU`0;$name`0;"))
            $pol.AddRange([BitConverter]::GetBytes($type))
            $pol.AddRange($unicode.GetBytes(";"))
            $pol.AddRange([BitConverter]::GetBytes([uint32]$data.Length))
            $pol.AddRange($unicode.GetBytes(";"))
            $pol.AddRange($data)
            $pol.AddRange($unicode.GetBytes("]"))
          }
          function Dword([string]$name, [uint32]$value) { Entry $name 4 ([BitConverter]::GetBytes($value)) }
          Dword AUOptions 4
          Dword ScheduledInstallDay 1
          Dword ScheduledInstallTime 3
          Entry "**del.ScheduledInstallFirstWeek" 1 ($unicode.GetBytes(" `0"))
          Dword ScheduledInstallFirstWeek 0
          $gp = "$env:windir\System32\GroupPolicy"
          New-Item -ItemType Directory "$gp\Machine" -Force | Out-Null
          [IO.File]::WriteAllBytes("$gp\Machine\Registry.pol", $pol.ToArray())
          Set-Content "$gp\gpt.ini" "[General]`r`ngPCMachineExtensionNames=[{35378EAC-683F-11D2-A89A-00C04FBBCFA2}{D02B1F72-3407-48AE-BA88-E8213C6761F1}]`r`nVersion=1" -Encoding ascii
          gpupdate /target:computer /force
          $key = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate"
          Get-ItemProperty "$key\AU" -ErrorAction SilentlyContinue | Format-List
          if ((Get-ItemProperty "$key\AU" -ErrorAction SilentlyContinue).AUOptions -ne 4) { throw "the local Group Policy was not applied" }
          # Was RSoP dazu festhält, zur Diagnose.
          Get-CimInstance -Namespace root\rsop\computer -ClassName RSOP_RegistryPolicySetting | Where-Object registryKey -like "*WindowsUpdate*" |
            Format-Table valueName, precedence, deleted, command, GPOID, valueType, @{ n = "value"; e = { [BitConverter]::ToString([byte[]]$_.value) } } -AutoSize |
            Out-String -Width 250
          # Nicht New-Item -Force: Das legt einen vorhandenen Schlüssel neu an und löscht dabei AU samt Werten.
          if (-not (Test-Path $key)) { New-Item $key | Out-Null }
          New-ItemProperty $key -Name TargetGroup -Value "Inventory-CI" -Force | Out-Null
          if ((Get-ItemProperty "$key\AU").AUOptions -ne 4) { throw "the policy values are gone" }
      - name: Collect the inventory
        shell: pwsh
        run: |
          & src\Inventory.Runner\bin\Release\net48\InventoryRunner.exe --collect > inventory.json
          if ($LASTEXITCODE -ne 0) { throw "--collect: $LASTEXITCODE" }
          $inventory = Get-Content inventory.json -Raw | ConvertFrom-Json
          $inventory.optionalFeatures | Format-Table name, caption -AutoSize | Out-String -Width 200
          $inventory.wsl | ConvertTo-Json -Depth 4
          $inventory.warnings
          if (-not $inventory.optionalFeatures -or $inventory.optionalFeatures.Count -eq 0) { throw "no optional features" }
          if ($inventory.warnings | Where-Object { $_ -like "Windows-Features:*" -or $_ -like "WSL:*" }) { throw "warnings for features or WSL" }
          if (-not $inventory.wsl.installed) { throw "WSL not reported as installed" }
          $distro = @($inventory.wsl.distros | Where-Object name -eq "Inventory-CI")
          if ($distro.Count -ne 1) { throw "distribution missing" }
          if ($distro[0].wslVersion -ne 2 -or -not $distro[0].userSid -or $distro[0].sizeBytes -ne 1024) { throw "distribution incomplete" }
          if (([datetime]$distro[0].lastUsedUtc).ToUniversalTime() -ne [datetime]::new(2026, 1, 2, 3, 4, 5, [DateTimeKind]::Utc)) { throw "last use: $($distro[0].lastUsedUtc)" }
          foreach ($name in "Inventory-CI-UNC", "Inventory-CI-Link") {
            $remote = @($inventory.wsl.distros | Where-Object name -eq $name)
            if ($remote.Count -ne 1) { throw "$name missing" }
            if ($remote[0].lastUsedUtc -or $remote[0].sizeBytes) { throw "${name}: the runner read a disk behind a network path" }
          }
      # Wie im Betrieb als Lokales System: Die Festplatte liest der Runner nur mit dem Token des Benutzers aus dessen Sitzung.
      # Hat der Benutzer des Jobs eine, stimmt das Datum; hat er keine, darf es keins geben (Lokales System liest nie selbst).
      - name: Collect as Local System
        shell: pwsh
        run: |
          $exe = (Resolve-Path src\Inventory.Runner\bin\Release\net48\InventoryRunner.exe).Path
          $out = "C:\wsl-ci\system.json"
          $action = New-ScheduledTaskAction -Execute "cmd.exe" -Argument "/c `"`"$exe`" --collect > `"$out`"`""
          Register-ScheduledTask -TaskName InventoryCollect -Action $action -User "NT AUTHORITY\SYSTEM" -RunLevel Highest | Out-Null
          $started = Get-Date
          Start-ScheduledTask -TaskName InventoryCollect
          do {
            Start-Sleep 5
            $info = Get-ScheduledTaskInfo -TaskName InventoryCollect
            $state = (Get-ScheduledTask -TaskName InventoryCollect).State
          } while (($state -eq "Running" -or $info.LastRunTime -lt $started) -and (Get-Date) -lt $started.AddMinutes(10))
          if ($info.LastTaskResult -ne 0) { throw "--collect as SYSTEM: $($info.LastTaskResult)" }
          $inventory = Get-Content $out -Raw | ConvertFrom-Json
          $inventory.wsl | ConvertTo-Json -Depth 4
          $inventory.warnings
          quser
          if ($inventory.warnings | Where-Object { $_ -like "WSL:*" }) { throw "warning for WSL" }
          foreach ($name in "Inventory-CI-UNC", "Inventory-CI-Link") {
            $remote = @($inventory.wsl.distros | Where-Object name -eq $name)
            if ($remote.Count -ne 1) { throw "$name missing" }
            if ($remote[0].lastUsedUtc -or $remote[0].sizeBytes) { throw "${name}: the runner read a disk behind a network path" }
          }
          $distro = @($inventory.wsl.distros | Where-Object name -eq "Inventory-CI")
          if ($distro.Count -ne 1) { throw "distribution missing" }
          # Update-Richtlinie: die Werte der lokalen Gruppenrichtlinie mit ihrer GPO aus RSoP, der Wert ohne GPO ohne.
          $policy = $inventory.updatePolicy
          $policy | ConvertTo-Json -Depth 5
          if ($inventory.warnings | Where-Object { $_ -like "Update-Richtlinie*" }) { throw "warning for the update policy" }
          if (-not $policy.rsopRead) { throw "RSoP not read" }
          if (-not $policy.groupPolicyAppliedUtc) { throw "no time of the last Group Policy run" }
          if ($null -eq $policy.groups) { throw "groups not read" }
          foreach ($expected in @(("AUOptions", "4"), ("ScheduledInstallDay", "1"), ("ScheduledInstallTime", "3"), ("ScheduledInstallFirstWeek", "0"))) {
            $setting = @($policy.settings | Where-Object name -eq $expected[0])
            if ($setting.Count -ne 1 -or $setting[0].value -ne $expected[1] -or $setting[0].key -ne "AU" -or $setting[0].source -ne "gpo" -or -not $setting[0].gpo -or
                ($setting[0].alsoSetBy | Where-Object { $_ })) {
              throw "$($expected[0]): $($setting | ConvertTo-Json -Depth 3)"
            }
          }
          $target = @($policy.settings | Where-Object name -eq "TargetGroup")
          if ($target.Count -ne 1 -or $target[0].value -ne "Inventory-CI" -or $target[0].source -ne "registry" -or $target[0].gpo) { throw "TargetGroup: $($target | ConvertTo-Json -Depth 3)" }
          $session = @(quser 2>$null) -match [regex]::Escape($env:USERNAME)
          if ($session) {
            if (([datetime]$distro[0].lastUsedUtc).ToUniversalTime() -ne [datetime]::new(2026, 1, 2, 3, 4, 5, [DateTimeKind]::Utc)) { throw "with the user's token: $($distro[0].lastUsedUtc)" }
          } elseif ($distro[0].lastUsedUtc -or $distro[0].sizeBytes) {
            throw "Local System read the disk itself"
          }
      # Remote-Befehl als Konto der Zugangsdaten: Der Runner läuft als Lokales System, meldet ein lokales Testkonto selbst an
      # und holt sich Benutzer und Passwort über den Schlüsselaustausch im Job-Verzeichnis. Das Skript spielt dabei den Server.
      - name: Run as the credentials user
        shell: pwsh
        run: |
          $exe = (Resolve-Path src\Inventory.Runner\bin\Release\net48\InventoryRunner.exe).Path
          $user = "invci"
          # Höchstens 14 Zeichen: Bei längeren fragt net user nach und legt ohne Antwort nichts an.
          $password = "Aa1" + [guid]::NewGuid().ToString("N").Substring(0, 11)
          Write-Output "::add-mask::$password"
          net user $user $password /add | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "net user: $LASTEXITCODE" }
          net localgroup Administrators $user /add | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "net localgroup: $LASTEXITCODE" }
          # Ein zweites Konto ohne Adminrechte für einen Schritt mit eigenen Zugangsdaten (wie bei Paket-Schritten). Das Recht
          # „Anmelden als Batchauftrag“ bekommt es über die Leistungsprotokollbenutzer (S-1-5-32-559), die es standardmäßig haben.
          $other = "invci2"
          $otherPassword = "Aa1" + [guid]::NewGuid().ToString("N").Substring(0, 11)
          Write-Output "::add-mask::$otherPassword"
          net user $other $otherPassword /add | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "net user ${other}: $LASTEXITCODE" }
          Add-LocalGroupMember -SID S-1-5-32-559 -Member $other

          # Wie JobSecrets.Answer auf dem Server: RSA-OAEP mit SHA-256, in Blöcken.
          function Send-Secret($dir, $account, $secret) {
            $request = Get-Content (Join-Path $dir "secret-request.json") -Raw | ConvertFrom-Json
            $rsa = [Security.Cryptography.RSA]::Create()
            $key = [Security.Cryptography.RSAParameters]::new()
            $key.Modulus = [Convert]::FromBase64String($request.modulus)
            $key.Exponent = [Convert]::FromBase64String($request.exponent)
            $rsa.ImportParameters($key)
            $encrypt = {
              param($text)
              $bytes = [Text.Encoding]::UTF8.GetBytes($text)
              $size = $rsa.KeySize / 8 - 66
              $blocks = [Collections.Generic.List[string]]::new()
              for ($offset = 0; $offset -lt $bytes.Length; $offset += $size) {
                $block = [byte[]]::new([Math]::Min($size, $bytes.Length - $offset))
                [Array]::Copy($bytes, $offset, $block, 0, $block.Length)
                $blocks.Add([Convert]::ToBase64String($rsa.Encrypt($block, [Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)))
              }
              , $blocks.ToArray()
            }
            $answer = @{ user = (& $encrypt $account); password = (& $encrypt $secret) } | ConvertTo-Json
            Set-Content (Join-Path $dir "secret.json.tmp") $answer -Encoding utf8NoBOM -NoNewline
            Move-Item (Join-Path $dir "secret.json.tmp") (Join-Path $dir "secret.json")
          }

          # Je Konto eine Anfrage mit neuem Schlüssel: credentialId leer = die Zugangsdaten der Verbindung, 2 = das zweite Konto.
          function Invoke-AsCredentialsUser($jobId, $secret, [switch]$TwoAccounts) {
            $dir = "C:\ci-runas\$jobId"
            New-Item -ItemType Directory $dir -Force | Out-Null
            $steps = @(@{ name = "whoami"; type = "PowerShell"; script = "whoami; whoami /groups"; timeoutSeconds = 120; runAs = "CredentialsUser" })
            if ($TwoAccounts) {
              $steps += @{ name = "whoami (second account)"; type = "PowerShell"; script = "whoami; whoami /groups"; timeoutSeconds = 120; runAs = "CredentialsUser"; credentialId = 2 }
            }
            @{ jobId = $jobId; steps = $steps } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $dir "job.json") -Encoding utf8NoBOM
            $action = New-ScheduledTaskAction -Execute $exe -Argument "--console `"$dir`""
            Register-ScheduledTask -TaskName $jobId -Action $action -User "NT AUTHORITY\SYSTEM" -RunLevel Highest | Out-Null
            Start-ScheduledTask -TaskName $jobId
            $deadline = (Get-Date).AddMinutes(5)
            $answered = @()
            while ((Get-Date) -lt $deadline) {
              $requestPath = Join-Path $dir "secret-request.json"
              $request = if (Test-Path $requestPath) { try { Get-Content $requestPath -Raw | ConvertFrom-Json } catch { $null } }
              if ($request -and $answered -notcontains $request.modulus) {
                if ($request.credentialId -eq 2) { Send-Secret $dir ".\$other" $otherPassword } else { Send-Secret $dir ".\$user" $secret }
                $answered += $request.modulus
              }
              if ((Test-Path (Join-Path $dir "result.json")) -and (Get-ScheduledTask -TaskName $jobId).State -ne "Running") { break }
              Start-Sleep -Milliseconds 300
            }
            if ($answered.Count -ne $steps.Count) { throw "${jobId}: the runner asked $($answered.Count) times for credentials, expected $($steps.Count)" }
            foreach ($name in "secret.json", "secret-request.json") {
              if (Test-Path (Join-Path $dir $name)) { throw "${jobId}: $name left behind" }
            }
            $result = Get-Content (Join-Path $dir "result.json") -Raw | ConvertFrom-Json
            $result | ConvertTo-Json -Depth 4
            $result
          }

          $result = Invoke-AsCredentialsUser "ci-runas" $password -TwoAccounts | Select-Object -Last 1
          $output = $result.steps[0].output
          if (-not $result.success -or $output -notmatch "\\$user" -or $output -notmatch "High Mandatory Level") { throw "as $user`: $($result | ConvertTo-Json -Depth 4)" }
          $second = $result.steps[1].output
          if ($second -notmatch "\\$other" -or $second -notmatch "Medium Mandatory Level") { throw "as $other`: $($result | ConvertTo-Json -Depth 4)" }

          # Falsches Passwort: eine verständliche Meldung statt eines Win32-Codes.
          $wrong = Invoke-AsCredentialsUser "ci-runas-wrong" ($password + "x") | Select-Object -Last 1
          if ($wrong.success -or $wrong.steps[0].error -notmatch "Benutzername oder Passwort falsch") { throw "wrong password: $($wrong | ConvertTo-Json -Depth 4)" }

  # Let's Encrypt eingebaut: der ACME-Ablauf gegen Pebble, den Testserver von Let's Encrypt, mit dessen DNS-Testserver statt
  # Azure DNS (den Zugriff auf Azure prüfen die Tests oben mit nachgebildeten Antworten). Pebble läuft mit seiner
  # Standardkonfiguration, aber nur dem Profil "default" (90 Tage): Ohne angefordertes Profil wählt es sonst je Auftrag zufällig,
  # auch "shortlived" (6 Tage), und die Erneuerung im Test wäre zum vorgestellten Zeitpunkt schon abgelaufen.
  acme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pebble with its DNS test server
        run: |
          docker network create acme
          docker run -d --name challtestsrv --network acme -p 8055:8055 ghcr.io/letsencrypt/pebble-challtestsrv:2.10.3 -defaultIPv6 "" -defaultIPv4 127.0.0.1
          docker run -d --name pebble --network acme -p 14000:14000 -e PEBBLE_VA_NOSLEEP=1 -e PEBBLE_WFE_NONCEREJECT=0 \
            -v "$PWD/.github/pebble-config.json:/pebble-config.json:ro" \
            ghcr.io/letsencrypt/pebble:2.10.3 -config /pebble-config.json -dnsserver challtestsrv:8053
          for i in $(seq 30); do curl -skf https://localhost:14000/dir >/dev/null && break; sleep 1; done
          curl -skf https://localhost:14000/dir
      - run: dotnet test tests/Inventory.Tests -c Release --filter "FullyQualifiedName~AcmeTests"
        env:
          INVENTORY_ACME_DIRECTORY: https://localhost:14000/dir
          INVENTORY_CHALLTESTSRV: http://localhost:8055
      - name: Logs of Pebble and its DNS test server
        if: failure()
        run: |
          docker logs pebble 2>&1 | tail -n 150
          docker logs challtestsrv 2>&1 | tail -n 80

  # Der Mac-Agent auf einem echten Mac (GitHub-Runner, Apple Silicon): als root wie im Betrieb, und das Inventar muss die
  # wichtigsten Bereiche enthalten. Die Parser selbst prüfen die Tests oben mit aufgezeichneten Ausgaben.
  macos-agent:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/Inventory.Agent.MacOS -c Release -r osx-arm64 -o agent
      - run: sudo ./agent/inventory-agent --collect > inventory.json
      - run: |
          jq '{platform, computerName, osName, osVersion, model, serialNumber, cpuName, cpuCores, memoryBytes, primaryIpAddress, software: (.software | length), softwareKinds: ([.software[] | "\(.architecture)/\(.origin)"] | group_by(.) | map({(.[0]): length}) | add), packages: [.apps[]? | "\(.kind) \(.name)"], disks, networkAdapters: [.networkAdapters[].name], users: .localUsers, macOs, volumes: .hardware.volumes, warnings}' inventory.json
      - run: >
          jq -e '.platform == "macOS" and (.computerName | length > 0) and (.osName | startswith("macOS")) and .cpuCores > 0 and .memoryBytes > 0
          and (.software | length > 0) and (.disks | length > 0) and (.networkAdapters | length > 0) and (.hardware.volumes[0].protected != null)
          and (.macOs.gatekeeperEnabled != null) and (.primaryIpAddress != null) and (.apps != null)
          and ([.software[] | select(.architecture != null and .origin != null)] | length > 0)' inventory.json
      # Das Installationspaket (Intune, Jamf), wie es der Server baut, mit dem eben veröffentlichten Agenten: installieren wie
      # ein MDM, ohne erreichbaren Server. Der Agent muss als LaunchDaemon laufen und es weiter versuchen.
      # Das Paket verlangt beide Agenten; auf diesem Runner (Apple Silicon) zählt nur der für arm64, der Platz für Intel bekommt eine Kopie.
      - run: mkdir -p agent-macos/osx-arm64 agent-macos/osx-x64 && cp agent/inventory-agent agent-macos/osx-arm64/ && cp agent/inventory-agent agent-macos/osx-x64/
      - run: dotnet test tests/Inventory.Tests --filter "FullyQualifiedName~MacPackageTests"
        env:
          INVENTORY_MAC_AGENT_DIR: ${{ github.workspace }}/agent-macos
          INVENTORY_MAC_PKG: ${{ github.workspace }}/inventory-agent.pkg
      - run: |
          pkgutil --expand inventory-agent.pkg expanded
          cat expanded/PackageInfo
          # Die leere Payload ist der Ordner "/": Rechte und Eigentümer dürfen sich dadurch nicht ändern.
          root_before="$(stat -f '%Sp %Su:%Sg' /)"
          sudo installer -pkg inventory-agent.pkg -target /
          [ "$(stat -f '%Sp %Su:%Sg' /)" = "$root_before" ]
          pkgutil --pkg-info inventory.agent
          sleep 10
          dir="/Library/Application Support/Inventory Agent"
          sudo ls -la "$dir"
          sudo cat "$dir/agent.log"
          sudo launchctl print system/inventory.agent | head -30
          sudo launchctl print system/inventory.agent | grep -q 'state = running'
          sudo grep -q 'Fehler' "$dir/agent.log"
          sudo codesign --verify "$dir/inventory-agent"
      # Zum Vergleich, falls das Paket nicht durchgeht: dasselbe (leere Payload, Skripte), wie Apples pkgbuild es baut.
      - if: failure()
        run: |
          mkdir -p ref/root ref/scripts && printf '#!/bin/bash\nexit 0\n' > ref/scripts/postinstall && chmod +x ref/scripts/postinstall
          pkgbuild --root ref/root --scripts ref/scripts --identifier ref.test --version 1 --install-location / ref.pkg
          xar --dump-toc=ref-toc.xml -f ref.pkg && cat ref-toc.xml
          pkgutil --expand ref.pkg ref/expanded && ls -la ref/expanded && cat ref/expanded/PackageInfo
          tail -60 /var/log/install.log
